<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPTIMAQ - AI Interview Coach & Preparation Dashboard</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="logo-container" style="flex-direction: column; align-items: flex-start; gap: 0.5rem; margin-bottom: 2rem;">
        <div style="display: flex; align-items: center; gap: 0.75rem; width: 100%;">
          <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          </div>
          <div class="logo-text">OPTIMAQ <span>AI</span></div>
        </div>
        <div style="display: flex; width: 100%; margin-top: 0.25rem;">
          <span id="api-status-badge" class="badge" style="font-size: 0.65rem; padding: 0.15rem 0.45rem; font-weight: 700; width: 100%; text-align: center;">STATUS</span>
        </div>
      </div>

      <nav style="flex: 1;">
        <ul class="nav-links">
          <li class="nav-item">
            <a class="nav-link active" data-view="dashboard">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z" />
              </svg>
              Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-view="profile">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              Profile & Resume
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-view="generator">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
              </svg>
              AI Interviewer
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-view="evaluation">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              AI Evaluation
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-view="settings">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              Settings
            </a>
          </li>
        </ul>
      </nav>

      <!-- Sidebar Bottom profile -->
      <div class="user-quick-profile">
        <div class="user-avatar" id="sidebar-avatar">U</div>
        <div class="user-info-brief">
          <div class="user-name-brief" id="sidebar-user-name">Guest User</div>
          <div class="user-role-brief" id="sidebar-user-role">Not Set</div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Mobile header -->
      <header class="mobile-header" style="height: var(--header-height); border-bottom: 1px solid var(--glass-border); display: none; align-items: center; padding: 0 1.5rem; justify-content: space-between; background: rgba(10, 14, 26, 0.95); position: sticky; top: 0; z-index: 99;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <button id="mobile-menu-toggle" style="background: transparent; border: none; color: white; cursor: pointer; display: flex; align-items: center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
          </button>
          <div class="logo-text" style="font-size: 1.25rem;">OPTIMAQ <span>AI</span></div>
        </div>
      </header>

      <!-- Viewport injection point -->
      <div class="view-container" id="view-container">
        <!-- Renders dynamically -->
      </div>
    </main>
  </div>

  <!-- App Entrypoint Script -->
  <script type="module" src="./src/main.js"></script>

  <style>
    /* Styling overrides for mobile header displaying */
    @media (max-width: 768px) {
      .mobile-header {
        display: flex !important;
      }
      .view-container {
        padding: 1.5rem !important;
      }
    }
  </style>
</body>
</html>
